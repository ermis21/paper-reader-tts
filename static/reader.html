<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>read along — paper audiobook</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Same palette and theme contract as index.html (pa:theme / data-theme). */
:root{
  --paper:#F4F6F2; --raise:#FFFFFF; --ink:#151B17; --ink-2:#3C4741; --mute:#69766F;
  --rule:#DEE4DD; --rule-2:#EBEFEA;
  --accent:#0F6B5A; --accent-soft:#E2EFEA; --accent-ink:#0C5245;
  --mark:#97690F; --mark-soft:rgba(240,196,80,.42);
  --bad:#A32E2E; --bad-soft:#F7E6E6;
  --r-lg:12px; --r-md:8px; --r-sm:6px;
  --sh-1:0 1px 2px rgba(20,26,23,.05),0 2px 8px rgba(20,26,23,.04);
  --sh-2:0 12px 40px rgba(20,26,23,.18);
  --ring:0 0 0 3px rgba(15,107,90,.22);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1412; --raise:#171D1A; --ink:#E6ECE7; --ink-2:#B4BFB8; --mute:#7F8C85;
  --rule:#29332D; --rule-2:#1F2723;
  --accent:#4FB49B; --accent-soft:#17312A; --accent-ink:#8FD9C6;
  --mark:#D9A650; --mark-soft:rgba(217,166,80,.38);
  --bad:#E88A8A; --bad-soft:#36211F;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  --sh-2:0 12px 40px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(79,180,155,.28);
}}
:root[data-theme="dark"]{
  --paper:#0F1412; --raise:#171D1A; --ink:#E6ECE7; --ink-2:#B4BFB8; --mute:#7F8C85;
  --rule:#29332D; --rule-2:#1F2723;
  --accent:#4FB49B; --accent-soft:#17312A; --accent-ink:#8FD9C6;
  --mark:#D9A650; --mark-soft:rgba(217,166,80,.38);
  --bad:#E88A8A; --bad-soft:#36211F;
  --sh-1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);
  --sh-2:0 12px 40px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(79,180,155,.28);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Source Serif 4","Iowan Old Style",Georgia,serif;font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
.btn{padding:6px 12px;border-radius:var(--r-sm);border:1px solid var(--accent);background:transparent;
  color:var(--accent);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;
  font-family:inherit;font-size:.85rem;white-space:nowrap}
.btn:hover{background:var(--accent);color:var(--paper)}
.btn.quiet{border-color:var(--rule);color:var(--mute)}
.btn.quiet:hover{border-color:var(--accent);color:var(--accent);background:transparent}
.btn.tiny{padding:4px 10px;font-size:.8rem}
.btn.on{background:var(--accent);color:var(--paper)}

/* The bar holds the ONLY <audio> on the page. It is position:fixed and its
   subtree is never rebuilt -- pages below may come and go (lazy render +
   eviction) without ever touching the player. This is the library page's
   front-end invariant, transplanted. */
#bar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 16px;background:var(--raise);border-bottom:1px solid var(--rule);
  box-shadow:var(--sh-1)}
#rtitle{font-family:"Zilla Slab",Rockwell,Georgia,serif;font-weight:600;font-size:1.05rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:0 1 auto}
#player{flex:1 1 auto;min-width:120px;height:36px}
#notice{margin:76px auto 0;max-width:820px;padding:12px 18px;border:1px solid var(--rule);
  border-radius:var(--r-md);background:var(--raise);color:var(--ink-2)}
#notice a{color:var(--accent)}
#notice.err{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

#wrap{display:flex;justify-content:center;gap:22px;align-items:flex-start;padding:86px 12px 60vh}
#pages{flex:0 1 auto;min-width:0}
.pg{position:relative;margin:0 auto 18px;background:#fff;box-shadow:var(--sh-1);
  border-radius:2px;cursor:pointer}
.pg canvas{display:block;border-radius:2px}
.pg .ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:2px}
.pg.ph{display:flex;align-items:center;justify-content:center;color:var(--mute);
  font-size:.8rem;background:var(--raise);box-shadow:none;border:1px dashed var(--rule)}
.hl{position:absolute;background:var(--mark-soft);mix-blend-mode:multiply;border-radius:2px;
  transition:opacity .15s}
.hl-page{position:absolute;background:var(--mark-soft);mix-blend-mode:multiply;
  outline:2px solid var(--mark);outline-offset:-2px;border-radius:3px;opacity:.5}
@media (prefers-reduced-motion:reduce){.hl{transition:none}}

/* ---------- margin notes ---------- */
#gutter{flex:0 0 310px;position:relative;align-self:stretch}
#ghead{position:sticky;top:64px;z-index:5;font-family:"Zilla Slab",Rockwell,Georgia,serif;
  font-weight:600;color:var(--ink-2);background:var(--paper);padding:2px 0;font-size:1.05rem}
#gcount{color:var(--mute);font-size:.8rem}
.g-block{position:absolute;left:0;right:0}
.g-page-label{font-size:.72rem;color:var(--mute);text-transform:uppercase;
  letter-spacing:.08em;margin:0 0 6px}
.note{background:var(--raise);border:1px solid var(--rule);border-radius:var(--r-md);
  padding:10px 12px;margin:0 0 10px;box-shadow:var(--sh-1);font-size:.88rem}
.n-quote,.e-quote{color:var(--mute);font-size:.78rem;border-left:3px solid var(--rule);
  padding-left:8px;margin:0 0 6px}
.n-quote{cursor:pointer}
.n-quote:hover{border-color:var(--accent);color:var(--accent-ink)}
.n-body{white-space:pre-wrap;word-break:break-word}
.n-meta{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:.72rem;color:var(--mute)}
.n-meta button{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;
  font-size:.78rem;padding:0}
.n-meta button:hover{text-decoration:underline}
.n-meta button.danger{color:var(--bad)}
.editor{background:var(--raise);border:1px solid var(--accent);border-radius:var(--r-md);
  padding:10px 12px;margin:0 0 10px;box-shadow:var(--sh-2);font-size:.88rem}
.editor textarea{width:100%;resize:vertical;min-height:72px;font:inherit;font-size:.9rem;
  color:var(--ink);background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r-sm);padding:8px}
.editor textarea:focus{outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.e-actions{display:flex;gap:8px;margin-top:8px;justify-content:flex-end}
.sel{position:absolute;outline:2px solid var(--accent);outline-offset:1px;border-radius:2px}
#notebtn{position:fixed;right:18px;bottom:18px;z-index:30;box-shadow:var(--sh-2)}
#notebtn[hidden]{display:none}
@media (max-width:980px){
  #wrap{flex-direction:column;align-items:center}
  #gutter{flex:1 1 auto;width:min(100%,680px);align-self:auto;min-height:0}
  .g-block{position:static;margin-bottom:14px}
}
</style>
</head>
<body>
<header id="bar">
  <a class="btn quiet tiny" href="/" title="Back to the library">&lsaquo; library</a>
  <span id="rtitle">loading&hellip;</span>
  <audio id="player" controls preload="auto"></audio>
  <button class="btn tiny on" id="followbtn" type="button" aria-pressed="true"
          title="Keep the spoken passage in view; scrolling by hand pauses it for 8 s">follow</button>
  <button class="btn quiet tiny" id="themebtn" type="button" aria-label="Toggle colour theme"></button>
</header>
<div id="notice" hidden></div>
<div id="wrap">
<main id="pages" aria-label="Document pages"></main>
<aside id="gutter" aria-label="Margin notes">
  <div id="ghead">notes <span id="gcount" class="mono"></span></div>
</aside>
</div>
<button id="notebtn" class="btn on" hidden type="button"
        title="Pin a note to the passage you just clicked">&#9998; note on this passage</button>

<script>
'use strict';
/* Theme first, before anything paints. */
function osDark(){ try{ return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches); }catch(e){ return false; } }
function themeNow(){ return document.documentElement.getAttribute('data-theme')||(osDark()?'dark':'light'); }
function themePaint(){ const b=document.getElementById('themebtn'); b.textContent=themeNow()==='dark'?'\u263E':'\u2600'; }
try{ const t=localStorage.getItem('pa:theme');
  if(t==='light'||t==='dark') document.documentElement.setAttribute('data-theme',t); }catch(e){}
themePaint();
document.getElementById('themebtn').addEventListener('click',()=>{
  const next=themeNow()==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('pa:theme',next);}catch(e){}
  themePaint();
});

(async function main(){
const $=s=>document.querySelector(s);
const pid=decodeURIComponent(location.pathname.replace(/\/+$/,'').split('/').pop());
const pagesEl=$('#pages'), audio=$('#player'), notice=$('#notice');
function say(msg,isErr){ notice.innerHTML=msg; notice.hidden=false;
  notice.classList.toggle('err',!!isErr); }
function die(msg){ say(msg,true); $('#rtitle').textContent='unavailable'; audio.hidden=true; }

/* ---------- load: alignment + library metadata + pdf.js itself ---------- */
let AL, doc, pdfjs;
try{
  const [alResp, libResp, mod] = await Promise.all([
    fetch('/api/papers/'+encodeURIComponent(pid)+'/alignment'),
    fetch('/api/library'),
    import('/static/vendor/pdfjs/pdf.min.mjs'),
  ]);
  if(!alResp.ok){
    const e=await alResp.json().catch(()=>({detail:'alignment unavailable'}));
    return die('Cannot build the read-along view: '+(e.detail||alResp.status)+
               '. <a href="/">Back to the library</a>.');
  }
  AL=await alResp.json();
  pdfjs=mod;
  pdfjs.GlobalWorkerOptions.workerSrc='/static/vendor/pdfjs/pdf.worker.min.mjs';
  const lib=libResp.ok?await libResp.json():{items:[]};
  const it=(lib.items||[]).find(x=>x.id===pid);
  $('#rtitle').textContent=it?it.title:pid;
  document.title=(it?it.title:pid)+' \u2014 read along';
  if(it&&it.audio&&it.audio.present&&it.audio.url) audio.src=it.audio.url;
  else audio.hidden=true;
  doc=await pdfjs.getDocument('/pdf/'+encodeURIComponent(pid)+'.pdf').promise;
}catch(e){
  return die('Failed to load the document: '+(e&&e.message?e.message:e)+
             '. <a href="/">Back to the library</a>.');
}

const chunks=AL.chunks||[];
const timed=chunks.filter(c=>c.t_start!=null);      // narrated prefix, in order
if(!timed.length)
  say('This document is not narrated yet, so there is nothing to highlight. '+
      'The pages below still work; render it from the <a href="/">library</a> first.');

/* ---------- page geometry ---------- */
const NPAGES=doc.numPages;
const dims=new Array(NPAGES);                        // {w,h} in PDF points, scale 1
try{
  for(let i=1;i<=NPAGES;i++){
    const p=await doc.getPage(i);
    const v=p.getViewport({scale:1});
    dims[i-1]={w:v.width,h:v.height};
  }
}catch(e){ /* a page that will not parse gets its neighbour's size on render */ }

let scale=1, colW=0;
function columnWidth(){ return Math.min(document.documentElement.clientWidth-24, 1100); }

/* ---------- placeholders + lazy rendering ---------- */
const pgEls=[];              // pno -> .pg element (placeholder or rendered)
const rendered=new Map();    // pno -> {canvas, ovl, renderTask}
const pageMap=new Map();     // pno -> [{ci, si, rects:[raw PDF rects]|null, pageOnly}]
for(let ci=0;ci<chunks.length;ci++){
  const c=chunks[ci];
  (c.segs||[]).forEach((s,si)=>{
    if(s.page_only!=null){
      const arr=pageMap.get(s.page_only)||[];
      arr.push({ci,si,rects:null,pageOnly:true}); pageMap.set(s.page_only,arr);
    }
    for(const r of (s.rects||[])){
      const arr=pageMap.get(r.page)||[];
      arr.push({ci,si,rects:[r],pageOnly:false}); pageMap.set(r.page,arr);
    }
  });
}

function layoutPlaceholders(){
  colW=columnWidth();
  pagesEl.textContent=''; pgEls.length=0; rendered.clear();
  for(let p=0;p<NPAGES;p++){
    const d=dims[p]||dims[p-1]||{w:612,h:792};
    const el=document.createElement('div');
    el.className='pg ph'; el.dataset.pno=p;
    el.style.width=colW+'px';
    el.style.height=Math.round(colW*d.h/d.w)+'px';
    el.textContent='page '+(p+1);
    pagesEl.appendChild(el); pgEls.push(el);
    io.observe(el);
  }
  positionGutter();
}

async function renderPage(pno){
  if(rendered.has(pno)) return;
  const el=pgEls[pno]; if(!el) return;
  rendered.set(pno,{canvas:null,ovl:null});           // reserve: no double render
  try{
    const page=await doc.getPage(pno+1);
    const d=dims[pno]||(dims[pno]=(()=>{const v=page.getViewport({scale:1});
                                        return {w:v.width,h:v.height};})());
    const vw=colW, vh=Math.round(colW*d.h/d.w);
    const viewport=page.getViewport({scale:vw/d.w});
    const dpr=window.devicePixelRatio||1;
    const canvas=document.createElement('canvas');
    canvas.width=Math.floor(viewport.width*dpr);
    canvas.height=Math.floor(viewport.height*dpr);
    canvas.style.width=Math.floor(viewport.width)+'px';
    canvas.style.height=Math.floor(viewport.height)+'px';
    const ctx=canvas.getContext('2d');
    const ovl=document.createElement('div'); ovl.className='ovl';
    el.textContent=''; el.classList.remove('ph');
    el.style.height=Math.floor(viewport.height)+'px';
    el.appendChild(canvas); el.appendChild(ovl);
    await page.render({canvasContext:ctx,viewport,
      transform:dpr!==1?[dpr,0,0,dpr,0,0]:null}).promise;
    rendered.set(pno,{canvas,ovl});
    page.cleanup();
    if(cur>=0) paintSeg(pno,ovl);                     // current segment may live here
    positionGutter();                                 // exact page height may shift blocks
  }catch(e){
    el.textContent='page '+(pno+1)+' failed to render';
    rendered.delete(pno);
  }
}

function evictPage(pno){
  const r=rendered.get(pno); if(!r||!r.canvas) return;
  const el=pgEls[pno];
  el.textContent=''; el.classList.add('ph'); el.textContent='page '+(pno+1);
  const d=dims[pno]; if(d) el.style.height=Math.round(colW*d.h/d.w)+'px';
  rendered.delete(pno);
}

const io=new IntersectionObserver(entries=>{
  for(const en of entries){
    const pno=+en.target.dataset.pno;
    if(en.isIntersecting) renderPage(pno);
    else evictPage(pno);
  }
},{rootMargin:'140% 0px 140% 0px'});

/* ---------- highlight sync ---------- */
let cur=-1, curSeg=-1;         // current chunk + sentence segment, -1 = none
let follow=true, lastUserScroll=0;
const SCROLL_FORGIVE_MS=8000;
const CONF_PAGE_ONLY=0.6;      // mirrors align.py: below this, rects are not painted

function chunkAt(t){
  /* last timed chunk whose t_start <= t; the 0.18 s build gap between chunks
     keeps the previous chunk lit until the next one starts */
  let lo=0, hi=timed.length-1, ans=-1;
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(timed[mid].t_start<=t){ ans=mid; lo=mid+1; } else hi=mid-1;
  }
  return ans<0?-1:timed[ans].i;
}

function segAt(c,t){
  /* which sentence of the chunk is being spoken at time t. There are no
     per-word audio timestamps; position within the chunk is interpolated by
     character fraction (f0/f1), which matches Kokoro's steady pace closely
     enough that the highlight reads as following the voice */
  if(!c||c.t_start==null||!c.segs||!c.segs.length) return -1;
  const dur=c.t_end-c.t_start;
  const pos=dur>0?(t-c.t_start)/dur:0;
  for(let si=0;si<c.segs.length;si++){
    if(pos<c.segs[si].f1||si===c.segs.length-1) return si;
  }
  return c.segs.length-1;
}

function paintSeg(pno,ovl){
  /* paint the current segment's share of this page (called on segment change
     for rendered pages and on render for the current page) */
  const c=chunks[cur]; if(!c) return;
  const s=(c.segs||[])[curSeg]; if(!s) return;
  const d=dims[pno]; if(!d) return;
  const sc=colW/d.w;
  const precise=s.rects&&s.rects.length&&s.conf>=CONF_PAGE_ONLY;
  if(!precise){
    if(s.page_only===pno){
      const el=document.createElement('div');
      el.className='hl-page';
      el.style.cssText='left:6px;top:6px;right:6px;bottom:6px;position:absolute';
      ovl.appendChild(el);
    }
    return;
  }
  for(const r of s.rects){
    if(r.page!==pno) continue;
    const el=document.createElement('div');
    el.className='hl';
    /* PyMuPDF coordinates are already top-left origin, y down: no flip */
    el.style.left=(r.x0*sc-2)+'px'; el.style.top=(r.y0*sc-1.5)+'px';
    el.style.width=((r.x1-r.x0)*sc+4)+'px'; el.style.height=((r.y1-r.y0)*sc+3)+'px';
    ovl.appendChild(el);
  }
}

function clearHighlights(){
  /* only the time-synced highlight; the click selection (.sel) survives, so
     a passage stays marked while the narration moves on */
  for(const {ovl} of rendered.values()){
    if(!ovl) continue;
    for(const n of [...ovl.children])
      if(n.classList.contains('hl')||n.classList.contains('hl-page')) n.remove();
  }
}

function followTo(c,s){
  const precise=s&&s.rects&&s.rects.length&&s.conf>=CONF_PAGE_ONLY;
  const pno=precise?s.rects[0].page:(s?s.page_only:null);
  if(pno==null||!pgEls[pno]) return;
  const el=pgEls[pno], d=dims[pno], sc=d?colW/d.w:1;
  const firstY=el.offsetTop+(precise?s.rects[0].y0*sc:0);
  const vh=window.innerHeight;
  /* already comfortably visible? then stay put */
  if(firstY>window.scrollY+vh*0.2 && firstY<window.scrollY+vh*0.75) return;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.scrollTo({top:Math.max(0,firstY-vh*0.35),behavior:reduce?'auto':'smooth'});
}

function onTime(){
  if(!timed.length) return;
  const ci=chunkAt(audio.currentTime);
  const c=ci>=0?chunks[ci]:null;
  const si=c?segAt(c,audio.currentTime):-1;
  if(ci===cur&&si===curSeg) return;
  cur=ci; curSeg=si; clearHighlights();
  if(cur<0) return;
  for(const [pno,{ovl}] of rendered) if(ovl) paintSeg(pno,ovl);
  if(follow && performance.now()-lastUserScroll>SCROLL_FORGIVE_MS)
    followTo(c,(c.segs||[])[si]);
}
audio.addEventListener('timeupdate',onTime);
audio.addEventListener('seeked',onTime);

/* manual scrolling suspends follow for a few seconds; fighting the user's
   scroll is the fastest way for a read-along UI to be hated */
for(const ev of ['wheel','touchmove']) window.addEventListener(ev,()=>{
  lastUserScroll=performance.now();
},{passive:true});
window.addEventListener('keydown',e=>{
  if([' ','PageDown','PageUp','ArrowDown','ArrowUp','Home','End'].includes(e.key))
    lastUserScroll=performance.now();
});

const fbtn=$('#followbtn');
fbtn.addEventListener('click',()=>{
  follow=!follow;
  fbtn.classList.toggle('on',follow);
  fbtn.setAttribute('aria-pressed',String(follow));
  if(follow&&cur>=0) followTo(chunks[cur],(chunks[cur].segs||[])[curSeg]);
});

/* ---------- click-to-seek ---------- */
pagesEl.addEventListener('click',e=>{
  const pg=e.target.closest('.pg'); if(!pg||!rendered.has(+pg.dataset.pno)) return;
  const pno=+pg.dataset.pno, d=dims[pno]; if(!d) return;
  const box=pg.getBoundingClientRect(), sc=colW/d.w;
  const px=(e.clientX-box.left)/sc, py=(e.clientY-box.top)/sc;
  const cands=pageMap.get(pno)||[];
  let hit=null, pageHit=null;
  for(const cand of cands){
    if(cand.pageOnly){ if(pageHit==null) pageHit=cand; continue; }
    for(const r of cand.rects){
      if(px>=r.x0-1&&px<=r.x1+1&&py>=r.y0-1&&py<=r.y1+1){ hit=cand; break; }
    }
    if(hit) break;
  }
  const cand=hit||pageHit;
  if(!cand) return;
  const ci=cand.ci;
  selectChunk(ci);
  const c=chunks[ci], s=(c.segs||[])[cand.si];
  if(c.t_start==null) return;
  /* seek to the estimated start of the clicked SENTENCE, not the chunk */
  const dur=c.t_end-c.t_start;
  audio.currentTime=c.t_start+(s?s.f0*dur:0)+0.02;
  if(audio.paused) audio.play().catch(()=>{});
});

/* ---------- margin notes ---------- */
const gutter=$('#gutter'), gcount=$('#gcount'), notebtn=$('#notebtn');
const chunkPage=chunks.map(c=>c.page_only!=null?c.page_only
                          :(c.rects&&c.rects.length?c.rects[0].page:null));
let notes=[], selChunk=-1, selEls=[], textCache=null;

async function api(method,url,body){
  const r=await fetch(url,{method,
    headers:body?{'Content-Type':'application/json'}:undefined,
    body:body?JSON.stringify(body):undefined});
  if(!r.ok){
    const e=await r.json().catch(()=>({detail:String(r.status)}));
    throw new Error(e.detail||r.status);
  }
  return r.json();
}
function fmtTime(epoch){
  const d=new Date(epoch*1000);
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})+' '+
         d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
async function chunkText(ci){
  if(textCache==null){
    try{ textCache=await (await fetch('/text/'+encodeURIComponent(pid)+'.txt')).text(); }
    catch(e){ textCache=''; }
  }
  const c=chunks[ci];
  return c?textCache.slice(c.char_start,c.char_end).trim():'';
}

function clearSelection(){
  for(const e of selEls) e.remove();
  selEls=[]; selChunk=-1; notebtn.hidden=true;
}
function selectChunk(ci){
  for(const e of selEls) e.remove();
  selEls=[]; selChunk=ci;
  const c=chunks[ci];
  if(c){
    for(const [pno,{ovl}] of rendered){
      if(!ovl) continue;
      const d=dims[pno]; if(!d) continue;
      const sc=colW/d.w;
      for(const r of (c.rects||[])){
        if(r.page!==pno) continue;
        const el=document.createElement('div');
        el.className='sel';
        el.style.left=(r.x0*sc-2)+'px'; el.style.top=(r.y0*sc-1.5)+'px';
        el.style.width=((r.x1-r.x0)*sc+4)+'px'; el.style.height=((r.y1-r.y0)*sc+3)+'px';
        ovl.appendChild(el); selEls.push(el);
      }
    }
  }
  notebtn.hidden=false;
}

function positionGutter(){
  if(!gutter) return;
  let floor=0;
  const blocks=[...gutter.querySelectorAll('.g-block')]
    .sort((a,b)=>(+a.dataset.pno)-(+b.dataset.pno));
  for(const el of blocks){
    const pno=+el.dataset.pno, pg=pgEls[pno];
    if(!pg) continue;
    const d=dims[pno], sc=d?colW/d.w:1;
    /* align with the highest anchor rect on the page, never above the page
       top, and never over the previous block -- dense pages cascade down */
    let top=pg.offsetTop+Math.max(0,(el._anchorY||0)*sc-8);
    top=Math.max(top,floor);
    el.style.top=top+'px';
    floor=top+el.offsetHeight+10;
  }
}

function noteCard(note){
  const el=document.createElement('div'); el.className='note'; el.dataset.nid=note.id;
  const q=document.createElement('div'); q.className='n-quote';
  q.textContent='\u201C'+note.quote.slice(0,90)+(note.quote.length>90?'\u2026':'')+'\u201D';
  q.title='Jump to this passage';
  q.addEventListener('click',()=>{
    const c=chunks[note.chunk_idx];
    if(c&&c.t_start!=null){
      audio.currentTime=c.t_start+0.02;
      if(audio.paused) audio.play().catch(()=>{});
    }
    const pno=chunkPage[note.chunk_idx];
    if(pno!=null&&pgEls[pno]){
      const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      pgEls[pno].scrollIntoView({block:'center',behavior:reduce?'auto':'smooth'});
    }
  });
  const b=document.createElement('div'); b.className='n-body'; b.textContent=note.body;
  const meta=document.createElement('div'); meta.className='n-meta';
  const t=document.createElement('span'); t.textContent=fmtTime(note.updated);
  const ed=document.createElement('button'); ed.type='button'; ed.textContent='edit';
  ed.addEventListener('click',()=>openEditor(note.chunk_idx,note));
  const del=document.createElement('button'); del.type='button';
  del.textContent='delete'; del.className='danger';
  del.addEventListener('click',async ()=>{
    if(del.dataset.arm){
      try{ await api('DELETE','/api/notes/'+note.id);
        notes=notes.filter(x=>x.id!==note.id); renderGutter(); }
      catch(e){ del.textContent='failed'; }
    }else{
      del.dataset.arm='1'; del.textContent='sure?';
      setTimeout(()=>{ if(!del.dataset.arm) return;
        delete del.dataset.arm; del.textContent='delete'; },3000);
    }
  });
  meta.append(t,ed,del);
  el.append(q,b,meta);
  return el;
}

function renderGutter(){
  closeEditor();
  for(const el of [...gutter.querySelectorAll('.g-block')]) el.remove();
  const byPage=new Map();
  let n=0;
  for(const note of notes){
    const p=chunkPage[note.chunk_idx];
    if(p==null) continue;
    const arr=byPage.get(p)||[]; arr.push(note); byPage.set(p,arr); n++;
  }
  for(const [pno,list] of [...byPage.entries()].sort((a,b)=>a[0]-b[0])){
    const block=document.createElement('div');
    block.className='g-block'; block.dataset.pno=pno;
    /* highest anchor y (PDF points) among this block's notes, for alignment */
    block._anchorY=Math.min(...list.map(note=>{
      const c=chunks[note.chunk_idx];
      if(!c||c.page_only!=null) return 0;
      const ys=(c.rects||[]).filter(r=>r.page===pno).map(r=>r.y0);
      return ys.length?Math.min(...ys):0;
    }));
    const lab=document.createElement('div');
    lab.className='g-page-label'; lab.textContent='page '+(pno+1);
    block.appendChild(lab);
    for(const note of list) block.appendChild(noteCard(note));
    gutter.appendChild(block);
  }
  gcount.textContent=n?('\u00b7 '+n):'';
  positionGutter();
}

let editorEl=null;
function closeEditor(){ if(editorEl){ editorEl.remove(); editorEl=null; } }
async function openEditor(ci,note){
  closeEditor();
  const c=chunks[ci]; if(!c) return;
  const quote=note?note.quote:(await chunkText(ci)).slice(0,120);
  const el=document.createElement('div'); el.className='editor';
  const q=document.createElement('div'); q.className='e-quote';
  q.textContent='\u201C'+quote.slice(0,90)+(quote.length>90?'\u2026':'')+'\u201D';
  const ta=document.createElement('textarea');
  ta.placeholder='Your note\u2026';
  if(note) ta.value=note.body;
  const acts=document.createElement('div'); acts.className='e-actions';
  const cancel=document.createElement('button');
  cancel.type='button'; cancel.className='btn quiet tiny'; cancel.textContent='cancel';
  cancel.addEventListener('click',closeEditor);
  const save=document.createElement('button');
  save.type='button'; save.className='btn tiny on';
  save.textContent=note?'save':'add note';
  async function doSave(){
    const body=ta.value.trim(); if(!body) return;
    save.disabled=true;
    try{
      if(note){
        const u=await api('PATCH','/api/notes/'+note.id,{body});
        Object.assign(note,u);
      }else{
        const created=await api('POST','/api/papers/'+encodeURIComponent(pid)+'/notes',
                                {chunk_idx:ci,char_off:0,body});
        notes.push(created);
      }
      closeEditor(); renderGutter();
    }catch(e){
      save.disabled=false; save.textContent='failed \u2013 retry';
    }
  }
  save.addEventListener('click',doSave);
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); doSave(); }
    if(e.key==='Escape'){ e.preventDefault(); closeEditor(); }
  });
  acts.append(cancel,save);
  el.append(q,ta,acts);
  /* the editor lives in the anchor page's gutter block, created if needed */
  const pno=Math.min(chunkPage[ci]!=null?chunkPage[ci]:0, NPAGES-1);
  let block=gutter.querySelector('.g-block[data-pno="'+pno+'"]');
  if(!block){
    block=document.createElement('div');
    block.className='g-block'; block.dataset.pno=pno;
    const cr=(c.rects||[]).filter(r=>r.page===pno).map(r=>r.y0);
    block._anchorY=cr.length?Math.min(...cr):0;
    const lab=document.createElement('div');
    lab.className='g-page-label'; lab.textContent='page '+(pno+1);
    block.appendChild(lab); gutter.appendChild(block);
    positionGutter();
  }
  block.appendChild(el); editorEl=el;
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
  ta.focus();
}
notebtn.addEventListener('click',()=>{ if(selChunk>=0) openEditor(selChunk,null); });

/* ---------- resize: re-lay out and let the observer re-render ---------- */
let rszT=null;
window.addEventListener('resize',()=>{
  clearTimeout(rszT);
  rszT=setTimeout(()=>{ layoutPlaceholders(); cur=-1; onTime(); positionGutter(); },250);
});

try{ notes=(await api('GET','/api/papers/'+encodeURIComponent(pid)+'/notes')).notes||[]; }
catch(e){ notes=[]; }
layoutPlaceholders();
renderGutter();
})();
</script>
